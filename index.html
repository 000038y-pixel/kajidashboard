<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家事ダッシュボード</title>

<link rel="manifest" href="manifest.json">

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  margin: 0;
  padding: 12px;
  background: #f7f7f7;
}

h1 {
  font-size: 18px;
}

button {
  padding: 6px 10px;
  font-size: 14px;
}

#taskGrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
  gap: 8px;
  margin-top: 12px;
}

.task {
  background: #fff;
  border-radius: 10px;
  padding: 6px;
  text-align: center;
  font-size: 12px;
  position: relative;
}

.task.overdue {
  background: #ffd6d6;
}

.task-box {
  font-size: 20px;
}

.task-date {
  font-size: 11px;
  color: #666;
}

.edit-btn {
  position: absolute;
  top: 4px;
  right: 4px;
  border: none;
  background: none;
  font-size: 16px;
}

/* モーダル */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2000;
}

.modal-content {
  background: #fff;
  padding: 14px;
  width: 90%;
  border-radius: 10px;
}

.modal-content input,
.modal-content textarea {
  width: 100%;
  margin-bottom: 8px;
  font-size: 14px;
}

.category-btn {
  margin: 4px 4px 4px 0;
}

/* クマ */
#bear {
  position: fixed;
  top: 8px;
  right: 8px;
  width: 70px;
  text-align: center;
}

#bear img {
  width: 100%;
}

#bearComment {
  font-size: 12px;
  background: #fff;
  border-radius: 6px;
  padding: 4px;
}
</style>
</head>

<body>

<h1>家事ダッシュボード</h1>
<button onclick="openAdd()">家事を追加</button>
<button onclick="addCategory()">分類を追加</button>

<div id="taskGrid"></div>

<!-- クマ -->
<div id="bear">
  <img id="bearImg" src="bear_normal.png">
  <div id="bearComment">がんばろう！</div>
</div>

<!-- モーダル -->
<div class="modal" id="modal">
  <div class="modal-content">
    <input id="nameInput" placeholder="家事名">
    <div id="categoryArea"></div>
    <textarea id="memoInput" placeholder="メモ（任意）"></textarea>
    <button onclick="saveTask()">保存</button>
    <button onclick="deleteTask()">削除</button>
    <button onclick="closeModal()">閉じる</button>
  </div>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");
let categories = JSON.parse(localStorage.getItem("categories") || '["7日以内","1か月以内","3か月以内"]');
let editingIndex = null;

function saveAll() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
  localStorage.setItem("categories", JSON.stringify(categories));
}

function formatDate(d) {
  d = new Date(d);
  return `${String(d.getFullYear()).slice(2)}/${d.getMonth()+1}/${d.getDate()}`;
}

function render() {
  const grid = document.getElementById("taskGrid");
  grid.innerHTML = "";
  const now = new Date();

  tasks.forEach((t, i) => {
    const diff = (now - new Date(t.last)) / 86400000;
    const div = document.createElement("div");
    div.className = "task" + (diff > 7 ? " overdue" : "");

    div.innerHTML = `
      <button class="edit-btn" onclick="openEdit(${i})">⋮</button>
      <div class="task-box">□</div>
      <div>${t.name}</div>
      <div class="task-date">${formatDate(t.last)}</div>
    `;

    div.onclick = e => {
      if (e.target.classList.contains("edit-btn")) return;
      t.last = new Date().toISOString();
      cheer();
      saveAll();
      render();
    };

    grid.appendChild(div);
  });

  updateBear();
}

function openAdd() {
  editingIndex = null;
  document.getElementById("nameInput").value = "";
  document.getElementById("memoInput").value = "";
  renderCategoryButtons(categories[0]);
  openModal();
}

function openEdit(i) {
  editingIndex = i;
  const t = tasks[i];
  document.getElementById("nameInput").value = t.name;
  document.getElementById("memoInput").value = t.memo || "";
  renderCategoryButtons(t.category);
  openModal();
}

function renderCategoryButtons(selected) {
  const area = document.getElementById("categoryArea");
  area.innerHTML = "";
  categories.forEach(c => {
    const b = document.createElement("button");
    b.textContent = c;
    b.className = "category-btn";
    if (c === selected) b.style.background = "#ccc";
    b.onclick = () => renderCategoryButtons(c);
    area.appendChild(b);
  });
}

function saveTask() {
  const name = nameInput.value.trim();
  if (!name) return;

  const category = [...document.querySelectorAll(".category-btn")]
    .find(b => b.style.background)?.textContent || categories[0];

  const memo = memoInput.value;

  if (editingIndex === null) {
    tasks.push({ name, category, memo, last: new Date().toISOString() });
  } else {
    Object.assign(tasks[editingIndex], { name, category, memo });
  }

  saveAll();
  closeModal();
  render();
}

function deleteTask() {
  if (editingIndex !== null && confirm("削除しますか？")) {
    tasks.splice(editingIndex, 1);
    saveAll();
    closeModal();
    render();
  }
}

function openModal() {
  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

function addCategory() {
  const c = prompt("分類名");
  if (c) {
    categories.push(c);
    saveAll();
  }
}

function cheer() {
  const msgs = ["えらい！","いいね！","その調子！","最高！"];
  bearComment.textContent = msgs[Math.floor(Math.random()*msgs.length)];
}

function updateBear() {
  if (!tasks.length) return;
  const done = tasks.filter(t => (new Date()-new Date(t.last))/86400000 < 1).length;
  const rate = done / tasks.length * 100;
  bearImg.src = rate < 30 ? "bear_cry.png" : rate < 70 ? "bear_normal.png" : "bear_happy.png";
}

render();
</script>

</body>
</html>
