<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>家事ダッシュボード</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">

<!-- キャッシュ対策 -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  margin: 0;
  padding: 10px;
}

h2 {
  margin-top: 28px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.task {
  border: 1px solid #ccc;
  padding: 6px;
  text-align: center;
  font-size: 12px;
  border-radius: 8px;
  background: white;
}

.task.done {
  background: #333;
  color: white;
}

.small {
  font-size: 10px;
  opacity: 0.8;
}

button {
  margin-top: 8px;
  padding: 6px 10px;
  font-size: 12px;
  background: #eee;
  border: none;
  border-radius: 6px;
}

#bearBox {
  position: fixed;
  top: 6px;
  right: 6px;
  width: 90px;
  text-align: center;
  z-index: 1000;
}

#bearBox img {
  width: 70px;
}

#bearComment {
  font-size: 11px;
}
</style>
</head>

<body>

<div id="bearBox">
  <img id="bearImg" src="bear_normal.png">
  <div id="bearComment">がんばろう！</div>
</div>

<button onclick="addTask()">家事を追加</button>
<button onclick="addCategory()">分類を追加</button>

<div id="app"></div>

<script>
/* ===== Service Worker ===== */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js");
}

/* ===== データ ===== */
let categories = JSON.parse(
  localStorage.getItem("categories") ||
  JSON.stringify([
    { name: "7日以内", limit: 7 },
    { name: "1ヶ月以内", limit: 30 },
    { name: "3ヶ月以内", limit: 90 }
  ])
);

let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");

/* ===== 共通 ===== */
function save() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
  localStorage.setItem("categories", JSON.stringify(categories));
}

function daysFrom(d) {
  return Math.floor((Date.now() - new Date(d)) / 86400000);
}

function formatDate(d) {
  const date = new Date(d);
  return `${date.getFullYear() % 100}/${date.getMonth() + 1}/${date.getDate()}`;
}

/* ===== クマ ===== */
function updateBear(message) {
  const done = tasks.filter(t => daysFrom(t.lastDone) <= t.limit).length;
  const rate = tasks.length ? done / tasks.length : 0;

  const img = document.getElementById("bearImg");
  const comment = document.getElementById("bearComment");

  if (message) {
    comment.textContent = message;
    return;
  }

  if (rate <= 0.3) {
    img.src = "bear_sad.png";
    comment.textContent = "ゆっくりでいいよ…";
  } else if (rate <= 0.7) {
    img.src = "bear_normal.png";
    comment.textContent = "いい調子！";
  } else {
    img.src = "bear_happy.png";
    comment.textContent = "すごい！完璧！";
  }
}

/* ===== 描画 ===== */
function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";

  categories.forEach(cat => {
    const h = document.createElement("h2");
    h.textContent = cat.name;
    app.appendChild(h);

    const grid = document.createElement("div");
    grid.className = "grid";

    tasks.filter(t => t.category === cat.name).forEach(t => {
      const d = daysFrom(t.lastDone);
      const div = document.createElement("div");

      div.className = "task" + (d <= t.limit ? " done" : "");
      if (d > t.limit + 7) div.style.background = "red";

      div.innerHTML = `
        ${t.name}<br>
        <span class="small">${formatDate(t.lastDone)}</span>
      `;

      div.onclick = () => {
        t.lastDone = new Date().toISOString();
        save();
        updateBear("えらい！家事できたね！");
        render();
      };

      div.oncontextmenu = e => {
        e.preventDefault();
        editTask(t);
      };

      grid.appendChild(div);
    });

    app.appendChild(grid);
  });

  updateBear();
}

/* ===== 操作 ===== */
function addTask() {
  const name = prompt("家事名");
  if (!name) return;

  const cat = prompt(
    "分類：" + categories.map(c => c.name).join(",")
  );
  const selected = categories.find(c => c.name === cat);
  if (!selected) return alert("分類が見つかりません");

  tasks.push({
    name,
    category: selected.name,
    limit: selected.limit,
    lastDone: new Date().toISOString(),
    memo: ""
  });

  save();
  render();
}

function addCategory() {
  const name = prompt("分類名");
  const limit = parseInt(prompt("期限（日数）"));
  if (!name || !limit) return;

  categories.push({ name, limit });
  save();
  render();
}

function editTask(t) {
  const memo = prompt("メモ（削除は delete）", t.memo || "");
  if (memo === "delete") {
    tasks = tasks.filter(x => x !== t);
  } else {
    t.memo = memo;
  }
  save();
  render();
}

/* ===== 初期描画 ===== */
render();
</script>

</body>
</html>
