<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家事ダッシュボード</title>

<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f6f7f5;
  --card:#ffffff;
  --done:#b0b0b0;
  --text:#333;
  --sub:#777;
  --accent:#dcdcdc;
  --danger1:#ffe5e5;
  --danger2:#ffb3b3;
}

body{
  font-family:"Zen Maru Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  margin:0;
  padding:12px;
  background:var(--bg);
  color:var(--text);
}

h1{
  font-size:18px;
  margin:4px 0 10px;
}

button{
  border:none;
  border-radius:8px;
  padding:6px 10px;
  font-size:13px;
  background:#eaeaea;
  color:#333;
}

button:active{
  transform:scale(0.97);
}

.category-section{
  margin-top:16px;
}

.category-title{
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
}

.taskGrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(70px,1fr));
  gap:6px;
}

.task{
  background:var(--card);
  border-radius:12px;
  padding:6px 4px;
  text-align:center;
  font-size:12px;
  position:relative;
  box-shadow:0 2px 6px rgba(0,0,0,0.06);
  transition:transform .15s,background .2s;
}

.task:active{
  transform:scale(0.95);
}

.task.done{
  background:var(--done);
  color:#fff;
}

.task.overdue1{ background:var(--danger1); }
.task.overdue2{ background:var(--danger2); }

.task-name{
  font-weight:500;
}

.task-date{
  font-size:10px;
  color:var(--sub);
}

.edit-btn{
  position:absolute;
  top:2px;
  right:2px;
  background:#f0f0f0;
  border-radius:50%;
  width:22px;
  height:22px;
  font-size:14px;
  line-height:22px;
}

/* モーダル */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000;
}

.modal-content{
  background:#fff;
  padding:14px;
  width:90%;
  border-radius:14px;
}

.modal-content input,
.modal-content textarea{
  width:100%;
  margin-bottom:8px;
  font-size:14px;
  padding:6px;
}

.category-btn{
  margin:4px 4px 4px 0;
}

/* クマ */
#bear{
  position:fixed;
  top:8px;
  right:8px;
  display:flex;
  align-items:center;
  gap:6px;
  z-index:1500;
}

#bear img{
  width:60px;
}

#bearComment{
  font-size:12px;
  background:#fff;
  border-radius:10px;
  padding:6px 8px;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
}
</style>
</head>

<body>

<h1>家事ダッシュボード</h1>
<button onclick="openAdd()">家事を追加</button>
<button onclick="addCategory()">分類を追加</button>

<div id="dashboard"></div>

<!-- クマ -->
<div id="bear">
  <div id="bearComment">がんばろう！</div>
  <img id="bearImg" src="bear_normal.png">
</div>

<!-- モーダル -->
<div class="modal" id="modal">
  <div class="modal-content">
    <input id="nameInput" placeholder="家事名">
    <div id="categoryArea"></div>
    <textarea id="memoInput" placeholder="メモ（任意）"></textarea>
    <button onclick="saveTask()">保存</button>
    <button onclick="deleteTask()">削除</button>
    <button onclick="closeModal()">閉じる</button>
  </div>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");
let categories = JSON.parse(localStorage.getItem("categories") || JSON.stringify([
  { name:"7日以内", days:7 },
  { name:"1か月以内", days:30 },
  { name:"3か月以内", days:90 }
]));
let editingIndex=null;

function saveAll(){
  localStorage.setItem("tasks",JSON.stringify(tasks));
  localStorage.setItem("categories",JSON.stringify(categories));
}

function formatDate(d){
  d=new Date(d);
  return `${String(d.getFullYear()).slice(2)}/${d.getMonth()+1}/${d.getDate()}`;
}

function render(){
  dashboard.innerHTML="";
  const now=new Date();

  categories.forEach(cat=>{
    const related=tasks.filter(t=>t.category===cat.name);
    if(!related.length) return;

    const sec=document.createElement("div");
    sec.className="category-section";
    sec.innerHTML=`<div class="category-title">${cat.name}</div>`;
    const grid=document.createElement("div");
    grid.className="taskGrid";

    related.forEach(t=>{
      const diff=(now-new Date(t.last))/86400000;
      const div=document.createElement("div");
      div.className="task";
      if(t.done) div.classList.add("done");
      if(diff>cat.days) div.classList.add(diff>cat.days+7?"overdue2":"overdue1");

      div.innerHTML=`
        <button class="edit-btn" onclick="openEdit(${tasks.indexOf(t)})">⋮</button>
        <div class="task-name">${t.name}</div>
        <div class="task-date">${formatDate(t.last)}</div>
      `;

      div.onclick=e=>{
        if(e.target.classList.contains("edit-btn")) return;
        t.last=new Date().toISOString();
        t.done=true;
        cheer();
        saveAll();
        render();
      };

      grid.appendChild(div);
    });

    sec.appendChild(grid);
    dashboard.appendChild(sec);
  });

  updateBear();
}

function openAdd(){
  editingIndex=null;
  nameInput.value="";
  memoInput.value="";
  renderCategoryButtons(categories[0].name);
  openModal();
}

function openEdit(i){
  editingIndex=i;
  const t=tasks[i];
  nameInput.value=t.name;
  memoInput.value=t.memo||"";
  renderCategoryButtons(t.category);
  openModal();
}

function renderCategoryButtons(selected){
  categoryArea.innerHTML="";
  categories.forEach(c=>{
    const b=document.createElement("button");
    b.textContent=c.name;
    b.className="category-btn";
    if(c.name===selected) b.style.background="#ccc";
    b.onclick=()=>renderCategoryButtons(c.name);
    categoryArea.appendChild(b);
  });
}

function saveTask(){
  const name=nameInput.value.trim();
  if(!name) return;

  const category=[...document.querySelectorAll(".category-btn")]
    .find(b=>b.style.background)?.textContent||categories[0].name;

  const memo=memoInput.value;

  if(editingIndex===null){
    tasks.push({name,category,memo,last:new Date().toISOString(),done:false});
  }else{
    Object.assign(tasks[editingIndex],{name,category,memo});
  }

  saveAll();closeModal();render();
}

function deleteTask(){
  if(editingIndex!==null&&confirm("削除しますか？")){
    tasks.splice(editingIndex,1);
    saveAll();closeModal();render();
  }
}

function addCategory(){
  const name=prompt("分類名");
  if(!name) return;
  const days=Number(prompt("何日以内？"));
  if(!days) return;
  categories.push({name,days});
  saveAll();render();
}

function openModal(){ modal.style.display="flex"; }
function closeModal(){ modal.style.display="none"; }

function cheer(){
  const msgs=["えらい！","いいね！","その調子！","最高！"];
  bearComment.textContent=msgs[Math.floor(Math.random()*msgs.length)];
}

function updateBear(){
  if(!tasks.length) return;
  const done=tasks.filter(t=>t.done).length;
  const rate=done/tasks.length*100;
  bearImg.src=rate<30?"bear_cry.png":rate<70?"bear_normal.png":"bear_happy.png";
}

render();
</script>

</body>
</html>
