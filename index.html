<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>家事ダッシュボード</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#ffffff" />

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  margin: 0;
  padding: 12px;
  background: #f7f7f7;
}

h1 {
  font-size: 18px;
  margin-bottom: 8px;
}

button {
  padding: 6px 10px;
  font-size: 14px;
  margin-right: 6px;
}

#taskGrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
  gap: 8px;
  margin-top: 12px;
}

.task {
  background: #fff;
  border-radius: 10px;
  padding: 6px;
  text-align: center;
  position: relative;
  font-size: 12px;
}

.task.overdue {
  background: #ffd6d6;
}

.task-icon {
  font-size: 22px;
}

.task-date {
  font-size: 11px;
  color: #666;
}

.edit-btn {
  position: absolute;
  top: 4px;
  right: 4px;
  font-size: 14px;
  background: none;
  border: none;
  cursor: pointer;
}

/* クマ */
#bear {
  position: fixed;
  top: 10px;
  right: 10px;
  width: 80px;
  text-align: center;
  z-index: 1000;
}

#bear img {
  width: 100%;
}

#bearComment {
  font-size: 12px;
  background: rgba(255,255,255,0.9);
  border-radius: 6px;
  padding: 4px;
  margin-top: 2px;
}
</style>
</head>

<body>

<h1>家事ダッシュボード</h1>

<button onclick="addTask()">家事を追加</button>
<button onclick="addCategory()">分類を追加</button>

<div id="taskGrid"></div>

<!-- クマ -->
<div id="bear">
  <img id="bearImg" src="bear_normal.png" />
  <div id="bearComment">がんばろう！</div>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");
let categories = JSON.parse(localStorage.getItem("categories") || '["7日以内","1か月以内"]');

function formatDate(dateStr) {
  const d = new Date(dateStr);
  return `${String(d.getFullYear()).slice(2)}/${d.getMonth()+1}/${d.getDate()}`;
}

function save() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
  localStorage.setItem("categories", JSON.stringify(categories));
}

function render() {
  const grid = document.getElementById("taskGrid");
  grid.innerHTML = "";

  const now = new Date();

  tasks.forEach((t, i) => {
    const last = new Date(t.last);
    const diff = Math.floor((now - last) / 86400000);

    const div = document.createElement("div");
    div.className = "task" + (diff > 7 ? " overdue" : "");

    div.innerHTML = `
      <button class="edit-btn" onclick="editTask(${i})">⋮</button>
      <div class="task-icon">${t.icon}</div>
      <div>${t.name}</div>
      <div class="task-date">${formatDate(t.last)}</div>
    `;

    div.onclick = (e) => {
      if (e.target.classList.contains("edit-btn")) return;
      t.last = new Date().toISOString();
      showCheer();
      save();
      render();
    };

    grid.appendChild(div);
  });

  updateBear();
}

function addTask() {
  const name = prompt("家事名");
  if (!name) return;

  const icon = prompt("絵文字（例：🧹）") || "🧹";
  const cat = categories[0];

  tasks.push({
    name,
    icon,
    category: cat,
    last: new Date().toISOString(),
    memo: ""
  });

  save();
  render();
}

function editTask(i) {
  const t = tasks[i];
  const action = prompt(
`1: 名前変更
2: メモ編集
3: 削除`
  );

  if (action === "1") {
    const n = prompt("新しい名前", t.name);
    if (n) t.name = n;
  } else if (action === "2") {
    t.memo = prompt("メモ", t.memo) || "";
  } else if (action === "3") {
    if (confirm("削除しますか？")) tasks.splice(i, 1);
  }

  save();
  render();
}

function addCategory() {
  const c = prompt("分類名");
  if (!c) return;
  categories.push(c);
  save();
}

function updateBear() {
  const total = tasks.length;
  if (total === 0) return;

  const done = tasks.filter(t => {
    const diff = (new Date() - new Date(t.last)) / 86400000;
    return diff < 1;
  }).length;

  const rate = (done / total) * 100;
  const img = document.getElementById("bearImg");

  if (rate <= 30) img.src = "bear_cry.png";
  else if (rate <= 70) img.src = "bear_normal.png";
  else img.src = "bear_happy.png";
}

function showCheer() {
  const comments = [
    "えらい！",
    "その調子！",
    "よくやったね！",
    "最高！"
  ];
  document.getElementById("bearComment").textContent =
    comments[Math.floor(Math.random() * comments.length)];
}

render();
</script>

</body>
</html>
