<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>家事ダッシュボード</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">

<!-- キャッシュ対策 -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  margin: 0;
  padding: 10px;
}

h2 {
  margin-top: 30px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.task {
  border: 1px solid #ccc;
  padding: 6px;
  text-align: center;
  font-size: 12px;
  border-radius: 8px;
  background: white;
}

.task.done {
  background: #333;
  color: white;
}

.small {
  font-size: 10px;
  opacity: 0.8;
}

button {
  margin-top: 10px;
  padding: 6px 10px;
  font-size: 12px;
  background: #eee;
  border: none;
  border-radius: 6px;
}

#bearBox {
  position: fixed;
  top: 8px;
  right: 8px;
  text-align: center;
  width: 90px;
}

#bearBox img {
  width: 80px;
}

#bearComment {
  font-size: 11px;
}
</style>
</head>

<body>

<div id="bearBox">
  <img id="bearImg" src="bear_normal.png">
  <div id="bearComment">がんばろう！</div>
</div>

<button onclick="addTask()">家事を追加</button>
<button onclick="addCategory()">分類を追加</button>

<div id="app"></div>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js");
}

let categories = JSON.parse(localStorage.getItem("categories") || '["7日以内","1ヶ月以内","3ヶ月以内"]');
let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");

function save() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
  localStorage.setItem("categories", JSON.stringify(categories));
}

function formatDate(d) {
  const date = new Date(d);
  return `${date.getFullYear() % 100}/${date.getMonth() + 1}/${date.getDate()}`;
}

function updateBear() {
  const done = tasks.filter(t => daysFrom(t.lastDone) <= t.limit).length;
  const rate = tasks.length ? done / tasks.length : 0;

  const img = document.getElementById("bearImg");
  const comment = document.getElementById("bearComment");

  if (rate <= 0.3) {
    img.src = "bear_sad.png";
    comment.textContent = "だいじょうぶ…";
  } else if (rate <= 0.7) {
    img.src = "bear_normal.png";
    comment.textContent = "いい感じ！";
  } else {
    img.src = "bear_happy.png";
    comment.textContent = "すごい！";
  }
}

function daysFrom(d) {
  return Math.floor((Date.now() - new Date(d)) / 86400000);
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";

  categories.forEach(cat => {
    const h = document.createElement("h2");
    h.textContent = cat;
    app.appendChild(h);

    const grid = document.createElement("div");
    grid.className = "grid";

    tasks.filter(t => t.category === cat).forEach(t => {
      const d = daysFrom(t.lastDone);
      const div = document.createElement("div");
      div.className = "task" + (d <= t.limit ? " done" : "");
      if (d > t.limit + 7) div.style.background = "red";

      div.innerHTML = `
        ${t.name}<br>
        <span class="small">${formatDate(t.lastDone)}</span>
      `;

      div.onclick = () => {
        t.lastDone = new Date().toISOString();
        save();
        updateBear();
        render();
      };

      div.oncontextmenu = e => {
        e.preventDefault();
        editTask(t);
      };

      grid.appendChild(div);
    });

    app.appendChild(grid);
  });

  updateBear();
}

function addTask() {
  const name = prompt("家事名");
  if (!name) return;

  const cat = prompt("分類：" + categories.join(","));
  const limit = parseInt(prompt("期限（日数）"));

  tasks.push({
    name,
    category: cat,
    limit,
    lastDone: new Date().toISOString()
  });

  save();
  render();
}

function addCategory() {
  const name = prompt("分類名");
  if (!name) return;
  categories.push(name);
  save();
  render();
}

function editTask(t) {
  const memo = prompt("メモ（削除は delete）", t.memo || "");
  if (memo === "delete") {
    tasks = tasks.filter(x => x !== t);
  } else {
    t.memo = memo;
  }
  save();
  render();
}

render();
</script>

</body>
</html>
