<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>家事ダッシュボード</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  margin: 8px;
}

button {
  padding: 6px 10px;
  margin: 4px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

.small {
  font-size: 12px;
  opacity: 0.6;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}

.icon {
  border: 1px solid #333;
  padding: 6px;
  text-align: center;
  border-radius: 6px;
  font-size: 12px;
  user-select: none;
}

.icon.black {
  background: black;
  color: white;
}

.icon.red {
  background: red;
  color: white;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  display: flex;
  justify-content: center;
  align-items: center;
}

.modal-inner {
  background: white;
  padding: 12px;
  width: 90%;
  border-radius: 8px;
}
</style>
</head>

<body>

<h3>家事ダッシュボード</h3>

<button id="addTask" class="small">家事を追加</button>
<button id="addCategory" class="small">分類を追加</button>

<div id="tasks"></div>

<!-- モーダル -->
<div id="modal" class="modal" style="display:none">
  <div class="modal-inner" id="modalInner"></div>
</div>
