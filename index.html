<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家事ダッシュボード</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  margin: 8px;
  padding-top: 90px; /* クマ分の余白 */
}

h3 { margin-bottom: 4px; }

button {
  padding: 6px 10px;
  margin: 4px 4px 8px 0;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 12px;
  background: #f2f2f2;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}

.icon {
  border: 1px solid #333;
  padding: 6px;
  border-radius: 6px;
  font-size: 11px;
  text-align: center;
  user-select: none;
}

.black {
  background: black;
  color: white;
}

.red {
  background: red;
  color: white;
}

.small {
  font-size: 10px;
  opacity: .6;
}

/* ===== クマ固定表示 ===== */
#bearBox {
  position: fixed;
  top: 8px;
  right: 8px;
  text-align: center;
  z-index: 1000;
}

#bearBox img {
  width: 90px;
}

#bearComment {
  font-size: 11px;
  background: #fff;
  border: 1px solid #ccc;
  border-radius: 6px;
  padding: 4px 6px;
  margin-top: 4px;
  display: none;
  max-width: 140px;
}

/* ===== モーダル ===== */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  display: none;
  justify-content: center;
  align-items: center;
}

.modal-inner {
  background: white;
  padding: 12px;
  width: 90%;
  border-radius: 8px;
}
</style>
</head>

<body>

<h3>家事ダッシュボード</h3>

<button id="btnAddTask">家事を追加</button>
<button id="btnAddCategory">分類を追加</button>

<div id="taskArea"></div>

<!-- クマ固定 -->
<div id="bearBox">
  <img id="bearImg" src="bear_normal.png">
  <div id="bearComment"></div>
</div>

<div id="modal" class="modal">
  <div class="modal-inner" id="modalInner"></div>
</div>

<script>
const cheerMessages = [
  "いい感じ！その調子！",
  "えらい！ちゃんと進んでるね",
  "ナイス！家が喜んでるよ",
  "さすが！一歩前進！",
  "今日も頑張ってるね！"
];

const state = {
  tasks: JSON.parse(localStorage.getItem("tasks") || "[]"),
  categories: JSON.parse(localStorage.getItem("categories") || JSON.stringify([
    {id:"7", name:"7日以内", days:7},
    {id:"30", name:"1ヶ月以内", days:30},
    {id:"90", name:"3ヶ月以内", days:90}
  ]))
};

function save() {
  localStorage.setItem("tasks", JSON.stringify(state.tasks));
  localStorage.setItem("categories", JSON.stringify(state.categories));
}

function daysFrom(date) {
  return Math.floor((Date.now() - new Date(date)) / 86400000);
}

function formatDate(dateStr) {
  const d = new Date(dateStr);
  return `${d.getFullYear()%100}/${d.getMonth()+1}/${d.getDate()}`;
}

function showCheer() {
  const el = document.getElementById("bearComment");
  el.textContent = cheerMessages[Math.floor(Math.random()*cheerMessages.length)];
  el.style.display = "block";
  setTimeout(()=>el.style.display="none", 2500);
}

function render() {
  const area = document.getElementById("taskArea");
  area.innerHTML = "";

  let doneCount = 0;

  state.categories.forEach(cat => {
    const h = document.createElement("h4");
    h.textContent = cat.name;
    area.appendChild(h);

    const g = document.createElement("div");
    g.className = "grid";

    state.tasks.filter(t => t.categoryId === cat.id).forEach(t => {
      const d = daysFrom(t.lastDone);
      const el = document.createElement("div");
      el.className = "icon";

      if (d <= cat.days) {
        el.classList.add("black");
        doneCount++;
      }
      if (d > cat.days + 7) el.classList.add("red");

      el.innerHTML = `
        ${t.title}<br>
        <span class="small">${formatDate(t.lastDone)}</span>
      `;

      let timer;
      el.ontouchstart = () => timer = setTimeout(()=>editTask(t.id),600);
      el.ontouchend = () => clearTimeout(timer);

      el.onclick = () => {
        t.lastDone = new Date().toISOString().slice(0,10);
        save();
        showCheer();
        render();
      };

      g.appendChild(el);
    });

    area.appendChild(g);
  });

  updateBear(doneCount);
}

function updateBear(done) {
  const rate = done / (state.tasks.length || 1) * 100;
  const img = document.getElementById("bearImg");
  if (rate <= 30) img.src = "bear_sad.png";
  else if (rate <= 70) img.src = "bear_normal.png";
  else img.src = "bear_happy.png";
}

/* ===== 既存機能 ===== */
function showModal(html) {
  modalInner.innerHTML = html;
  modal.style.display = "flex";
}
function closeModal() { modal.style.display = "none"; }

function addTask() {
  showModal(`
    <h4>家事を追加</h4>
    <input id="tname" placeholder="家事名"><br><br>
    ${state.categories.map(c=>`<button onclick="selectCat('${c.id}')">${c.name}</button>`).join("")}
    <input type="hidden" id="cat"><br><br>
    <button onclick="saveTask()">保存</button>
    <button onclick="closeModal()">キャンセル</button>
  `);
}
function selectCat(id){ cat.value=id; }

function saveTask() {
  state.tasks.push({
    id: Date.now().toString(),
    title: tname.value,
    categoryId: cat.value,
    lastDone: new Date().toISOString().slice(0,10),
    memo:""
  });
  save(); closeModal(); render();
}

function editTask(id) {
  const t = state.tasks.find(x=>x.id===id);
  showModal(`
    <h4>編集</h4>
    <input id="ename" value="${t.title}"><br><br>
    <textarea id="ememo">${t.memo||""}</textarea><br><br>
    <button onclick="updateTask('${id}')">保存</button>
    <button onclick="deleteTask('${id}')">削除</button>
  `);
}
function updateTask(id){
  const t = state.tasks.find(x=>x.id===id);
  t.title = ename.value;
  t.memo = ememo.value;
  save(); closeModal(); render();
}
function deleteTask(id){
  state.tasks = state.tasks.filter(x=>x.id!==id);
  save(); closeModal(); render();
}

function addCategory(){
  showModal(`
    <h4>分類を追加</h4>
    <input id="cname" placeholder="分類名"><br><br>
    <input id="cdays" type="number" placeholder="日数"><br><br>
    <button onclick="saveCategory()">保存</button>
    <button onclick="closeModal()">キャンセル</button>
  `);
}
function saveCategory(){
  state.categories.push({
    id: Date.now().toString(),
    name: cname.value,
    days: Number(cdays.value)
  });
  save(); closeModal(); render();
}

btnAddTask.onclick = addTask;
btnAddCategory.onclick = addCategory;

render();
</script>

</body>
</html>
