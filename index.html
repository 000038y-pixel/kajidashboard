<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>家事ダッシュボード</title>

<!-- フォント -->
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Zen Maru Gothic', sans-serif;
  background: linear-gradient(#f7f8fa, #eef1f5);
  color: #333;
}

/* ===== クマ ===== */
#bear {
  position: fixed;
  top: 10px;
  right: 10px;
  width: 90px;
  z-index: 100;
}
#bearComment {
  position: fixed;
  top: 100px;
  right: 10px;
  background: white;
  padding: 6px 10px;
  border-radius: 12px;
  font-size: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  display: none;
}

/* ===== ヘッダ ===== */
header {
  padding: 16px;
  font-size: 20px;
  font-weight: 500;
}

/* ===== 分類 ===== */
.section {
  padding: 0 12px 20px;
}
.section h2 {
  font-size: 14px;
  color: #666;
  margin: 10px 0;
}

/* ===== カード ===== */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
  gap: 10px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 10px 6px;
  text-align: center;
  box-shadow: 0 4px 8px rgba(0,0,0,0.08);
  font-size: 13px;
  transition: transform 0.15s ease, background 0.3s;
  user-select: none;
}

.card:active {
  transform: scale(0.92);
}

/* 状態色 */
.normal { background: white; }
.soon { background: #fff2cc; }
.expired { background: #ffd6d6; }
.done { background: #666; color: white; }

/* 日付 */
.date {
  font-size: 11px;
  margin-top: 4px;
  opacity: 0.8;
}

/* ===== ボタン ===== */
.buttons {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
}

button {
  border: none;
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 12px;
  background: #ccc;
  color: #333;
}
</style>
</head>

<body>

<img id="bear" src="bear_normal.png">
<div id="bearComment"></div>

<header>家事ダッシュボード</header>

<div id="dashboard"></div>

<div class="buttons">
  <button onclick="addTask()">家事を追加</button>
  <button onclick="addCategory()">分類を追加</button>
</div>

<script>
const comments = [
  "えらい！",
  "未来の自分が助かってるよ",
  "一歩前進！",
  "今日はここまででもOK",
  "ちゃんとやっててすごい"
];

let categories = JSON.parse(localStorage.getItem("categories")) || [
  { name: "7日以内", days: 7 },
  { name: "1か月以内", days: 30 },
  { name: "3か月以内", days: 90 }
];

let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

function formatDate(d) {
  return `${d.getFullYear().toString().slice(2)}/${d.getMonth()+1}/${d.getDate()}`;
}

function render() {
  const dash = document.getElementById("dashboard");
  dash.innerHTML = "";

  categories.forEach(cat => {
    const sec = document.createElement("div");
    sec.className = "section";
    sec.innerHTML = `<h2>${cat.name}</h2>`;
    const grid = document.createElement("div");
    grid.className = "grid";

    tasks.filter(t => t.category === cat.name).forEach(task => {
      const card = document.createElement("div");
      card.className = "card";

      const last = new Date(task.last);
      const diff = (Date.now() - last) / 86400000;

      if (task.justDone) card.classList.add("done");
      else if (diff > cat.days + 7) card.classList.add("expired");
      else if (diff > cat.days) card.classList.add("soon");
      else card.classList.add("normal");

      card.innerHTML = `
        ${task.name}
        <div class="date">${formatDate(last)}</div>
      `;

      card.onclick = () => complete(task);
      grid.appendChild(card);
    });

    sec.appendChild(grid);
    dash.appendChild(sec);
  });

  localStorage.setItem("tasks", JSON.stringify(tasks));
}

function complete(task) {
  task.last = new Date().toISOString();
  task.justDone = true;

  showComment();

  setTimeout(() => {
    task.justDone = false;
    render();
  }, 3000);

  render();
}

function showComment() {
  const c = document.getElementById("bearComment");
  c.textContent = comments[Math.floor(Math.random()*comments.length)];
  c.style.display = "block";
  setTimeout(() => c.style.display = "none", 2000);
}

function addTask() {
  const name = prompt("家事名");
  if (!name) return;

  const cat = prompt(categories.map(c => c.name).join("\n"));
  tasks.push({ name, category: cat, last: new Date().toISOString() });
  render();
}

function addCategory() {
  const name = prompt("分類名");
  const days = prompt("日数");
  categories.push({ name, days: Number(days) });
  localStorage.setItem("categories", JSON.stringify(categories));
  render();
}

render();
</script>

</body>
</html>
