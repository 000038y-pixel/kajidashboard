<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家事ダッシュボード</title>

<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
  margin: 0;
  padding: 12px;
  background: linear-gradient(#f7f8fa, #eef1f5);
  color: #333;
}

h1 {
  font-size: 18px;
  margin-bottom: 8px;
}

button {
  padding: 6px 12px;
  font-size: 13px;
  border-radius: 16px;
  border: none;
  background: #ddd;
}

/* ===== 分類 ===== */
.category-section {
  margin-top: 20px;
}

.category-title {
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 8px;
  color: #555;
}

/* ===== タスク ===== */
.taskGrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
  gap: 10px;
}

.task {
  background: #fff;
  border-radius: 14px;
  padding: 10px 6px;
  text-align: center;
  font-size: 13px;
  position: relative;
  box-shadow: 0 4px 8px rgba(0,0,0,0.08);
  transition: transform 0.15s ease, background 0.3s;
}

.task:active {
  transform: scale(0.94);
}

.task.overdue {
  background: #ffd6d6;
}

.task-name {
  font-weight: 500;
}

.task-date {
  font-size: 11px;
  color: #666;
  margin-top: 2px;
}

/* 編集ボタン */
.edit-btn {
  position: absolute;
  top: 4px;
  right: 6px;
  border: none;
  background: none;
  font-size: 18px;
  color: #888;
}

/* ===== モーダル ===== */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2000;
}

.modal-content {
  background: #fff;
  padding: 16px;
  width: 90%;
  border-radius: 14px;
}

.modal-content input,
.modal-content textarea {
  width: 100%;
  margin-bottom: 10px;
  font-size: 14px;
  border-radius: 8px;
  border: 1px solid #ccc;
  padding: 6px;
}

.category-btn {
  margin: 4px 4px 4px 0;
  border-radius: 14px;
  background: #eee;
}

/* ===== クマ ===== */
#bear {
  position: fixed;
  top: 8px;
  right: 8px;
  width: 72px;
  text-align: center;
  z-index: 1000;
}

#bear img {
  width: 100%;
}

#bearComment {
  font-size: 11px;
  background: #fff;
  border-radius: 8px;
  padding: 4px 6px;
  margin-top: 4px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}
</style>
</head>

<body>

<h1>家事ダッシュボード</h1>
<button onclick="openAdd()">家事を追加</button>
<button onclick="addCategory()">分類を追加</button>

<div id="dashboard"></div>

<!-- クマ -->
<div id="bear">
  <img id="bearImg" src="bear_normal.png">
  <div id="bearComment">がんばろう！</div>
</div>

<!-- モーダル -->
<div class="modal" id="modal">
  <div class="modal-content">
    <input id="nameInput" placeholder="家事名">
    <div id="categoryArea"></div>
    <textarea id="memoInput" placeholder="メモ（任意）"></textarea>
    <button onclick="saveTask()">保存</button>
    <button onclick="deleteTask()">削除</button>
    <button onclick="closeModal()">閉じる</button>
  </div>
</div>

<script>
/* ===== ここから下は Version260103 の JS をそのまま ===== */
let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");
let categories = JSON.parse(localStorage.getItem("categories") || JSON.stringify([
  { name: "7日以内", days: 7 },
  { name: "1か月以内", days: 30 },
  { name: "3か月以内", days: 90 }
]));
let editingIndex = null;

function saveAll() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
  localStorage.setItem("categories", JSON.stringify(categories));
}

function formatDate(d) {
  d = new Date(d);
  return `${String(d.getFullYear()).slice(2)}/${d.getMonth()+1}/${d.getDate()}`;
}

function render() {
  const dashboard = document.getElementById("dashboard");
  dashboard.innerHTML = "";
  const now = new Date();

  categories.forEach(cat => {
    const relatedTasks = tasks.filter(t => t.category === cat.name);
    if (relatedTasks.length === 0) return;

    const section = document.createElement("div");
    section.className = "category-section";
    section.innerHTML = `<div class="category-title">${cat.name}</div>`;

    const grid = document.createElement("div");
    grid.className = "taskGrid";

    relatedTasks.forEach(t => {
      const diff = (now - new Date(t.last)) / 86400000;
      const div = document.createElement("div");
      div.className = "task" + (diff > cat.days ? " overdue" : "");

      div.innerHTML = `
        <button class="edit-btn" onclick="openEdit(${tasks.indexOf(t)})">⋮</button>
        <div class="task-name">${t.name}</div>
        <div class="task-date">${formatDate(t.last)}</div>
      `;

      div.onclick = e => {
        if (e.target.classList.contains("edit-btn")) return;
        t.last = new Date().toISOString();
        cheer();
        saveAll();
        render();
      };

      grid.appendChild(div);
    });

    section.appendChild(grid);
    dashboard.appendChild(section);
  });

  updateBear();
}

function openAdd() {
  editingIndex = null;
  nameInput.value = "";
  memoInput.value = "";
  renderCategoryButtons(categories[0].name);
  openModal();
}

function openEdit(i) {
  editingIndex = i;
  const t = tasks[i];
  nameInput.value = t.name;
  memoInput.value = t.memo || "";
  renderCategoryButtons(t.category);
  openModal();
}

function renderCategoryButtons(selected) {
  categoryArea.innerHTML = "";
  categories.forEach(c => {
    const b = document.createElement("button");
    b.textContent = c.name;
    b.className = "category-btn";
    if (c.name === selected) b.style.background = "#ccc";
    b.onclick = () => renderCategoryButtons(c.name);
    categoryArea.appendChild(b);
  });
}

function saveTask() {
  const name = nameInput.value.trim();
  if (!name) return;

  const category =
    [...document.querySelectorAll(".category-btn")]
      .find(b => b.style.background)?.textContent || categories[0].name;

  const memo = memoInput.value;

  if (editingIndex === null) {
    tasks.push({ name, category, memo, last: new Date().toISOString() });
  } else {
    Object.assign(tasks[editingIndex], { name, category, memo });
  }

  saveAll();
  closeModal();
  render();
}

function deleteTask() {
  if (editingIndex !== null && confirm("削除しますか？")) {
    tasks.splice(editingIndex, 1);
    saveAll();
    closeModal();
    render();
  }
}

function addCategory() {
  const name = prompt("分類名");
  if (!name) return;
  const days = Number(prompt("何日以内？"));
  if (!days) return;
  categories.push({ name, days });
  saveAll();
}

function openModal() { modal.style.display = "flex"; }
function closeModal() { modal.style.display = "none"; }

function cheer() {
  const msgs = ["えらい！","いいね！","その調子！","最高！"];
  bearComment.textContent = msgs[Math.floor(Math.random()*msgs.length)];
}

function updateBear() {
  if (!tasks.length) return;
  const done = tasks.filter(t => (new Date()-new Date(t.last))/86400000 < 1).length;
  const rate = done / tasks.length * 100;
  bearImg.src =
    rate < 30 ? "bear_cry.png" :
    rate < 70 ? "bear_normal.png" :
    "bear_happy.png";
}

render();
</script>

</body>
</html>
